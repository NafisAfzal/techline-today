name: manual-cloudflare-preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Gate B before collection or deployment
        run: node scripts/release-gate.mjs --publish --preview
        env:
          SITE_URL: ${{ vars.PREVIEW_SITE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_APPROVED_SHA: ${{ vars.RELEASE_APPROVED_SHA }}
          PIPELINE_AI_ENABLED: 'false'
      - run: npm install --global pnpm@10.33.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.22'
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: uv run python -m pipeline --mode live
        env:
          PIPELINE_AI_ENABLED: 'false'
      - run: uv run python -m pipeline --validate
      - name: Build and inspect preview
        run: pnpm build && pnpm security && pnpm verify:content-rights && pnpm verify:site && node scripts/verify-build.mjs --preview && node scripts/editorial-quality.mjs --production
        env:
          SITE_URL: ${{ vars.PREVIEW_SITE_URL }}
          SITE_NOINDEX: 'true'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm smoke:live
      - name: Deploy authorized noindex preview
        run: pnpm deploy:preview
        env:
          SITE_URL: ${{ vars.PREVIEW_SITE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_APPROVED_SHA: ${{ vars.RELEASE_APPROVED_SHA }}
          PIPELINE_AI_ENABLED: 'false'
      - run: pnpm smoke:production
        env:
          SMOKE_BASE_URL: ${{ vars.PREVIEW_SITE_URL }}
          SMOKE_EXPECT_INDEXING: 'false'
