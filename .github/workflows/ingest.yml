name: ingest-build-deploy
on:
  workflow_dispatch:
    inputs:
      allow_initial_seed:
        description: 'Allow an approved FIRST collection only; never use to recover lost history'
        type: boolean
        default: false
  # Recurring triggers may be added only after the release approval gate.
permissions:
  contents: read
concurrency:
  group: production-ingest
  cancel-in-progress: false
jobs:
  production:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify owner release authorization before external work
        run: node scripts/release-gate.mjs --publish
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_APPROVED_SHA: ${{ vars.RELEASE_APPROVED_SHA }}
          PIPELINE_AI_ENABLED: ${{ vars.PIPELINE_AI_ENABLED }}
      - run: npm install --global pnpm@10.33.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7 (peeled commit)
        with:
          version: '0.12.22'
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: uv run ruff check pipeline
      - run: uv run pytest
      - run: uv run python -m pipeline --mode fixture
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm audit:dependencies
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      # Restore only after fixture checks; synthetic archives are isolated in .cache/fixture-archives.
      - name: Restore successful production snapshot
        id: snapshot
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/published-state
          key: production-data-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: production-data-v3-
      - name: Verify and restore published state
        if: steps.snapshot.outputs.cache-matched-key != ''
        run: uv run python -m scripts.production_state restore
      - name: Restore provider call reservations
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/provider-usage-live.json
            .cache/translations-live.json
          key: production-usage-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: production-usage-v1-
      - name: Block unexpected loss of published history
        if: steps.snapshot.outputs.cache-matched-key == ''
        run: node scripts/release-gate.mjs --publish --seed
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_APPROVED_SHA: ${{ vars.RELEASE_APPROVED_SHA }}
          PIPELINE_AI_ENABLED: ${{ vars.PIPELINE_AI_ENABLED }}
          ALLOW_INITIAL_SEED: ${{ github.event.inputs.allow_initial_seed }}
      - name: Collect and validate live evidence
        run: uv run python -m pipeline --mode live
        env:
          PIPELINE_AI_ENABLED: ${{ vars.PIPELINE_AI_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          CLOUDFLARE_AI_MODEL: ${{ vars.CLOUDFLARE_AI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          OPENAI_COMPAT_BASE_URL: ${{ vars.OPENAI_COMPAT_BASE_URL }}
          OPENAI_COMPAT_MODEL: ${{ vars.OPENAI_COMPAT_MODEL }}
          PIPELINE_USER_AGENT: ${{ vars.PIPELINE_USER_AGENT }}
      - run: uv run python -m pipeline --validate
      - name: Check eligible live evidence before deciding publication
        run: node scripts/content-rights.mjs --snapshot-only && node scripts/editorial-quality.mjs --production
      - name: Detect semantic edition changes
        id: changes
        run: node scripts/edition-change.mjs
      - name: Build live edition
        if: steps.changes.outputs.changed == 'true'
        run: pnpm build && pnpm security && pnpm verify:site && pnpm smoke:live && pnpm deploy:check
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
      - name: Verify live edition
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/verify-build.mjs --production
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: pnpm quality:content --production
        if: steps.changes.outputs.changed == 'true'
      - name: Retain the validated release bundle for rollback
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validated-live-assets
          path: apps/web/dist/
          retention-days: 2
      - name: Deploy validated assets
        if: steps.changes.outputs.changed == 'true'
        id: deploy
        run: pnpm deploy
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_APPROVED_SHA: ${{ vars.RELEASE_APPROVED_SHA }}
          PIPELINE_AI_ENABLED: ${{ vars.PIPELINE_AI_ENABLED }}
      - name: Post-deployment hosted smoke
        if: steps.deploy.outcome == 'success'
        run: pnpm smoke:production
        env:
          SMOKE_BASE_URL: ${{ vars.SITE_URL }}
          SMOKE_EXPECT_INDEXING: 'true'
      - name: Record published edition receipt
        if: steps.deploy.outcome == 'success'
        run: node scripts/edition-change.mjs --record
      - name: Save successful production snapshot
        if: steps.deploy.outcome == 'success' || steps.changes.outputs.changed == 'false'
        run: uv run python -m scripts.production_state save
      - name: Cache verified published state
        if: steps.deploy.outcome == 'success' || steps.changes.outputs.changed == 'false'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/published-state
          key: production-data-v3-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve provider usage even if publication fails
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/provider-usage-live.json
            .cache/translations-live.json
          key: production-usage-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Run summary
        if: always()
        run: uv run python scripts/run_summary.py
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deploy.outcome }}
