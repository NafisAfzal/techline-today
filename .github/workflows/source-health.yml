name: live-source-health
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapters:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7 (peeled commit)
        with:
          version: '0.12.22'
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run python -m pipeline --mode live
      - name: Health summary
        if: always()
        run: uv run python scripts/run_summary.py
